# src/main/resources/application.yml
spring:
  application:
    name: pharmasaas
 
  datasource:
    url: jdbc:mysql://localhost:3306/pharmasaas?useSSL=false&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
 
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway gère le schéma en prod
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        cache:
          use_second_level_cache: false
        jdbc:
          batch_size: 25          # Batch inserts pour les lignes de vente
    open-in-view: false           # Désactivé : évite les N+1 silencieux
 
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
 
jwt:
  secret: ${JWT_SECRET}           # 256-bit key en variable d'environnement
  expiration: 86400000            # 24h en millisecondes
  refresh-expiration: 604800000   # 7 jours
 
server:
  port: 9090
  error:
    include-message: on-param
 
logging:
  level:
    org.hibernate.SQL: DEBUG      # Désactiver en prod
    com.pharmasaas: INFO
